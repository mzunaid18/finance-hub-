{% extends "base.html" %}


{% block content %}


<section class="dashboard">


<h1>
Create Account
</h1>



<form method="POST">


<label>
Name
</label>

<br>

<input 
type="text"
name="name"
placeholder="Enter Name"
required>


<br><br>



<label>
Email
</label>

<br>

<input 
type="email"
name="email"
placeholder="Enter Email"
required>



<br><br>



<label>
Password
</label>

<br>


<input
type="password"
name="password"
placeholder="Enter Password"
required>



<br><br>



<button type="submit">

Register

</button>



</form>


<br>


<a href="/login">
Already have an account? Login
</a>



</section>



{% endblock %}
